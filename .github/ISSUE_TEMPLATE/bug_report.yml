name: 🐛 バグレポート
description: 改善に向けたレポートを作成
title: "[バグ]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        バグレポートの作成にお時間をいただき、ありがとうございます！
        問題の再現と修正のために、できるだけ詳細な情報をお聞かせください。

  - type: textarea
    id: description
    attributes:
      label: バグの説明
      description: バグの内容を明確かつ簡潔に説明してください。
      placeholder: バグについて説明してください...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 問題が発生する手順
      placeholder: |
        1. '...' にアクセス
        2. '...' をクリック
        3. '...' までスクロール
        4. エラーが発生
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      description: 期待していた動作を明確かつ簡潔に説明してください。
      placeholder: どのような動作を期待していましたか？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に起こった動作を明確かつ簡潔に説明してください。
      placeholder: 実際にはどのような動作でしたか？
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: 問題の種類
      description: 問題の種類を選択してください
      options:
        - 誤った情報（価格、条件など）
        - リンク切れ
        - 古い情報
        - カテゴリ分類の誤り
        - その他（追加の詳細で指定してください）
    validations:
      required: true

  - type: input
    id: service-name
    attributes:
      label: 対象サービス名
      description: 問題が発生しているサービス名を教えてください
      placeholder: 例: GitHub Student Developer Pack
    validations:
      required: false

  - type: input
    id: verified-date
    attributes:
      label: 確認日
      description: 問題を確認した日付を教えてください
      placeholder: 例: 2025-11-05
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 追加情報
      description: 問題に関するその他の情報（スクリーンショットや問題が発生する特定のウェブサイトなど）を追加してください。
      placeholder: その他の追加情報...